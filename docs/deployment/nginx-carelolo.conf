server {
    server_name carelolo.com;

    root /var/www/homecare/public;
    index index.php index.html index.htm;

    access_log /var/log/nginx/carelolo_access.log;
    error_log /var/log/nginx/carelolo_error.log;

    client_max_body_size 25M;

    # Compress HTML and other text assets. Images and WOFF2 fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/wasm
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/homecare/public;
        default_type "text/plain";
    }

    location = /twilio/voice {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/twilio {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
    }

    location = /healthz-voice {
        proxy_pass http://127.0.0.1:8088/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite filenames contain a content hash, so a one-year browser cache is safe.
    location ^~ /build/assets/ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 1y;
    }

    # Public, non-hashed assets receive a shorter cache to avoid long-lived stale uploads.
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|avif|webp|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /llms.txt    { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/carelolo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carelolo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name www.carelolo.com;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/carelolo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carelolo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://carelolo.com$request_uri;
}

server {
    server_name homecare.hub.healthcare;

    root /var/www/homecare/public;
    index index.php index.html index.htm;

    access_log /var/log/nginx/homecare_redirect_access.log;
    error_log /var/log/nginx/homecare_redirect_error.log;

    client_max_body_size 25M;

    location = /twilio/voice {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/twilio {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
    }

    location = /healthz-voice {
        proxy_pass http://127.0.0.1:8088/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Keep legacy webhook callbacks working while redirecting normal traffic.
    location ^~ /webhooks/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        return 301 https://carelolo.com$request_uri;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/homecare.hub.healthcare/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homecare.hub.healthcare/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name carelolo.com www.carelolo.com homecare.hub.healthcare;

    root /var/www/homecare/public;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/homecare/public;
        default_type "text/plain";
    }

    location / {
        return 301 https://carelolo.com$request_uri;
    }
}
